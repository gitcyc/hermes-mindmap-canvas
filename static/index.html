<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Hermes Mindmap Canvas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="https://unpkg.com/reactflow@11/dist/style.css" />

  <style>
    html, body, #root {
      margin:0;
      width: 100%;
      height: 100%;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e5e7eb;
    }

    .app {
      display: grid;
      grid-template-columns: 1fr 360px;
      grid-template-rows: 56px 1fr;
      width: 100%;
      height: 100%;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: #111827;
      border-bottom: 1px solid #374151;
      grid-column: 1 / -1;
    }

    .title {
      font-weight: 700;
      margin-right: 16px;
      color: #f9fafb;
    }

    input, select, button, textarea {
      border:1px solid #374151;
      background: #1f2937;
      color: #f9fafb;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 14px;
    }

    textarea {
      resize: vertical;
      font-family: inherit;
    }

    button {
      cursor: pointer;
      background: #2563eb;
      border-color: #2563eb;
    }

    button.secondary {
      background: #374151;
      border-color: #4b5563;
    }

    .canvas {
      width: 100%;
      height: 100%;
      position: relative;
    }

    .search-box {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 10;
    }

    .search-box input {
      width: 200px;
      background: #1f2937cc;
      backdrop-filter: blur(4px);
    }

    .node-done { background: #064e3b !important; border-color: #10b981 !important; }
    .node-doing { background: #1e3a8a !important; border-color: #60a5fa !important; }
    .node-todo { background: #374151 !important; border-color: #9ca3af !important; }
    .node-blocked { background: #7f1d1d !important; border-color: #f87171 !important; }
    .node-highlight { box-shadow: 0 0 0 3px #fbbf24, 0 10px 20px rgba(0,0,0,0.25) !important; }

    .node-label {
      font-weight: 650;
      color: #f9fafb;
      white-space: pre-wrap;
    }

    .node-status {
      font-size: 11px;
      margin-top: 6px;
      opacity: 0.85;
      color: #d1d5db;
    }

    .node-notes-preview {
      font-size: 12px;
      margin-top: 6px;
      color: #9ca3af;
      line-height: 1.4;
      max-height: 36px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .node-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 6px;
    }

    .badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 6px;
      background: #374151;
      color: #e5e7eb;
    }

    .badge-priority-low { background: #065f46; color: #6ee7b7; }
    .badge-priority-medium { background: #92400e; color: #fcd34d; }
    .badge-priority-high { background: #991b1b; color: #fca5a5; }
    .badge-priority-urgent { background: #7c2d12; color: #fdba74; }
    .badge-type { background: #1e3a8a; color: #93c5fd; }
    .badge-owner { background: #4c1d95; color: #c4b5fd; }
    .badge-source { background: #365314; color: #bef264; }

    .node-attachments {
      margin-top: 6px;
      font-size: 11px;
      color: #60a5fa;
    }

    .attachment-item {
      display: inline-block;
      margin-right: 6px;
      padding: 2px 6px;
      background: #1e3a8a;
      border-radius: 4px;
    }

    .detail-panel {
      background: #111827;
      border-left: 1px solid #374151;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .detail-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .detail-title {
      font-weight: 700;
      font-size: 16px;
      color: #f9fafb;
    }

    .detail-close {
      background: none;
      border: none;
      color: #9ca3af;
      font-size: 20px;
      cursor: pointer;
      padding: 0;
    }

    .detail-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .detail-label {
      font-size: 12px;
      color: #9ca3af;
    }

    .detail-value {
      color: #f9fafb;
      font-size: 14px;
    }

    .detail-actions {
      display: flex;
      gap: 8px;
      margin-top: auto;
    }

    .quick-edit-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .quick-edit-dialog {
      background: #111827;
      border: 1px solid #374151;
      border-radius: 12px;
      padding: 20px;
      width: 400px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .quick-edit-title {
      font-weight: 700;
      color: #f9fafb;
    }

    .quick-edit-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    .highlighted {
      background: #fbbf24 !important;
      border-color: #f59e0b !important;
    }
  </style>
</head>

<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/reactflow@11/dist/umd/index.js"></script>

<script type="text/babel">
const {
  ReactFlow,
  Background,
  Controls,
  MiniMap,
  useNodesState,
  useEdgesState
} = window.ReactFlow;

const { useEffect, useMemo, useState, useCallback } = React;

function nodeStyle(status) {
  const base = {
    border: "1px solid #60a5fa",
    borderRadius: 14,
    padding: 12,
    minWidth: 180,
    maxWidth: 280,
    color: "#f9fafb",
    boxShadow: "0 10px 20px rgba(0,0,0,0.25)"
  };

  if (status === "done") {
    return {...base, background: "#064e3b", borderColor: "#10b981"};
  }
  if (status === "doing") {
    return {...base, background: "#1e3a8a", borderColor: "#60a5fa"};
  }
  if (status === "blocked") {
    return {...base, background: "#7f1d1d", borderColor: "#f87171"};
  }
  return {...base, background: "#374151", borderColor: "#9ca3af"};
}

function priorityClass(priority) {
  if (!priority) return "";
  return `badge-priority-${priority}`;
}

function renderBadges(n) {
  const badges = [];
  if (n.priority) {
    badges.push(<span key="priority" className={`badge ${priorityClass(n.priority)}`}>{n.priority}</span>);
  }
  if (n.type) {
    badges.push(<span key="type" className="badge badge-type">{n.type}</span>);
  }
  if (n.owner) {
    badges.push(<span key="owner" className="badge badge-owner">{n.owner}</span>);
  }
  if (n.source) {
    badges.push(<span key="source" className="badge badge-source">{n.source}</span>);
  }
  if (badges.length === 0) return null;
  return <div className="node-badges">{badges}</div>;
}

function renderAttachments(n) {
  const attachments = n.attachments || [];
  if (attachments.length === 0) return null;
  return (
    <div className="node-attachments">
      {attachments.map((a, i) => (
        <span key={i} className="attachment-item">{a.name || "file"}</span>
      ))}
    </div>
  );
}

function nodeMatchesSearch(n, searchQuery) {
  if (!searchQuery) return false;
  const q = searchQuery.toLowerCase();
  if ((n.label || "").toLowerCase().includes(q)) return true;
  if ((n.notes || "").toLowerCase().includes(q)) return true;
  if ((n.status || "").toLowerCase().includes(q)) return true;
  if ((n.priority || "").toLowerCase().includes(q)) return true;
  if ((n.type || "").toLowerCase().includes(q)) return true;
  if ((n.owner || "").toLowerCase().includes(q)) return true;
  if ((n.source || "").toLowerCase().includes(q)) return true;
  const attachments = n.attachments || [];
  for (const a of attachments) {
    if ((a.name || "").toLowerCase().includes(q)) return true;
  }
  return false;
}

function toFlowNodes(map, selectedNodeId, searchQuery) {
  return (map.nodes || []).map(n => {
    const notesPreview = (n.notes || "").trim().length > 0
      ? (n.notes || "").trim().substring(0, 50)
      : "";

    const isHighlighted = searchQuery && nodeMatchesSearch(n, searchQuery);
    const isSelected = n.id === selectedNodeId;

    let style = nodeStyle(n.status || "todo");
    if (isHighlighted) {
      style = {...style, boxShadow: "0 0 0 3px #fbbf24, 0 10px 20px rgba(0,0,0,0.25)"};
    }

    return {
      id: n.id,
      position: { x: Number(n.x || 0), y: Number(n.y || 0) },
      data: {
        label: (
          <div>
            <div className="node-label">{n.label || n.id}</div>
            <div className="node-status">{n.status || "todo"} · {n.id}</div>
            {notesPreview && <div className="node-notes-preview">{notesPreview}</div>}
            {renderBadges(n)}
            {renderAttachments(n)}
          </div>
        ),
        nodeData: n
      },
      style
    };
  });
}

function toFlowEdges(map) {
  return (map.edges || []).map(e => ({
    id: e.id,
    source: e.source,
    target: e.target,
    label: e.label || "",
    animated: true,
    style: { stroke: "#93c5fd" },
    labelStyle: { fill: "#e5e7eb", fontWeight: 600 }
  }));
}

function App() {
  const [mapName, setMapName] = useState("hermes");
  const [rawMap, setRawMap] = useState(null);
  const [nodes, setNodes, onNodesChange] = useNodesState([]);
  const [edges, setEdges, onEdgesChange] = useEdgesState([]);
  const [parentId, setParentId] = useState("root");
  const [label, setLabel] = useState("");
  const [status, setStatus] = useState("todo");
  const [selectedNodeId, setSelectedNodeId] = useState(null);
  const [searchQuery, setSearchQuery] = useState("");
  const [quickEditNode, setQuickEditNode] = useState(null);
  const [quickEditLabel, setQuickEditLabel] = useState("");
  const [quickEditNotes, setQuickEditNotes] = useState("");

  const selectedNode = useMemo(() => {
    if (!selectedNodeId || !rawMap) return null;
    return (rawMap.nodes || []).find(n => n.id === selectedNodeId) || null;
  }, [selectedNodeId, rawMap]);

  async function loadMap(name = mapName) {
    const res = await fetch(`/api/maps/${name}`);
    const data = await res.json();
    setRawMap(data);
    setNodes(toFlowNodes(data, selectedNodeId, searchQuery));
    setEdges(toFlowEdges(data));
  }

  async function sendOp(op) {
    const res = await fetch(`/api/maps/${mapName}/ops`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(op)
    });
    const data = await res.json();
    if (!data.ok) {
      alert(JSON.stringify(data));
    }
  }

  useEffect(() => {
    loadMap(mapName);

    const proto = location.protocol === "https:" ? "wss" : "ws";
    const ws = new WebSocket(`${proto}://${location.host}/ws/maps/${mapName}`);

    ws.onmessage = (event) => {
      const msg = JSON.parse(event.data);
      if (msg.type === "update") {
        setRawMap(msg.map);
        setNodes(toFlowNodes(msg.map, selectedNodeId, searchQuery));
        setEdges(toFlowEdges(msg.map));
      }
    };

    return () => ws.close();
  }, [mapName]);

  useEffect(() => {
    if (rawMap) {
      setNodes(toFlowNodes(rawMap, selectedNodeId, searchQuery));
    }
  }, [selectedNodeId, searchQuery]);

  const onNodeDragStop = useCallback((event, node) => {
    sendOp({
      op: "update_node",
      id: node.id,
      x: Math.round(node.position.x),
      y: Math.round(node.position.y)
    });
  }, [mapName]);

  const onNodeClick = useCallback((event, node) => {
    setSelectedNodeId(node.id);
  }, []);

  const onPaneClick = useCallback(() => {
    setSelectedNodeId(null);
  }, []);

  const onNodeDoubleClick = useCallback((event, node) => {
    const nodeData = node.data?.nodeData;
    if (nodeData) {
      setQuickEditNode(nodeData);
      setQuickEditLabel(nodeData.label || "");
      setQuickEditNotes(nodeData.notes || "");
    }
  }, []);

  async function addNode() {
    if (!label.trim()) return;
    await sendOp({
      op: "add_node",
      parent_id: parentId || "root",
      label: label.trim(),
      status
    });
    setLabel("");
  }

  async function layout() {
    await sendOp({op: "layout"});
  }

  async function reset() {
    if (!confirm("Reset current mindmap?")) return;
    await sendOp({
      op: "reset",
      title: mapName,
      root_label: mapName
    });
    setSelectedNodeId(null);
  }

  function exportMarkdown() {
    window.open(`/api/maps/${mapName}/export/markdown`, "_blank");
  }

  async function saveDetail() {
    if (!selectedNode) return;
    const nodeData = selectedNode;
    const updates = {
      op: "update_node",
      id: nodeData.id,
      label: document.getElementById("detail-label").value,
      status: document.getElementById("detail-status").value,
      notes: document.getElementById("detail-notes").value,
      priority: document.getElementById("detail-priority").value,
      type: document.getElementById("detail-type").value,
      owner: document.getElementById("detail-owner").value,
      source: document.getElementById("detail-source").value,
    };
    const attachmentsStr = document.getElementById("detail-attachments").value.trim();
    if (attachmentsStr) {
      try {
        updates.attachments = JSON.parse(attachmentsStr);
      } catch (e) {
        alert("Attachments must be valid JSON array");
        return;
      }
    }
    await sendOp(updates);
  }

  async function saveQuickEdit() {
    if (!quickEditNode) return;
    await sendOp({
      op: "update_node",
      id: quickEditNode.id,
      label: quickEditLabel,
      notes: quickEditNotes
    });
    setQuickEditNode(null);
  }

  return (
    <div className="app">
      <div className="topbar">
        <div className="title">Hermes Mindmap Canvas</div>

        <span>Map</span>
        <input value={mapName} onChange={e => setMapName(e.target.value || "hermes")} style={{width: 130}} />

        <span>Parent</span>
        <input value={parentId} onChange={e => setParentId(e.target.value)} style={{width: 120}} />

        <input
          value={label}
          onChange={e => setLabel(e.target.value)}
          onKeyDown={e => { if (e.key === "Enter") addNode(); }}
          placeholder="New node label"
          style={{width: 260}}
        />

        <select value={status} onChange={e => setStatus(e.target.value)}>
          <option value="todo">todo</option>
          <option value="doing">doing</option>
          <option value="done">done</option>
          <option value="blocked">blocked</option>
        </select>

        <button onClick={addNode}>Add</button>
        <button className="secondary" onClick={layout}>Auto Layout</button>
        <button className="secondary" onClick={() => loadMap()}>Refresh</button>
        <button className="secondary" onClick={reset}>Reset</button>
        <button className="secondary" onClick={exportMarkdown}>Export Markdown</button>

        <div style={{flex: 1}} />
        <input
          placeholder="Search nodes..."
          value={searchQuery}
          onChange={e => setSearchQuery(e.target.value)}
          style={{width: 200}}
        />
      </div>

      <div className="canvas">
        <ReactFlow
          nodes={nodes}
          edges={edges}
          onNodesChange={onNodesChange}
          onEdgesChange={onEdgesChange}
          onNodeDragStop={onNodeDragStop}
          onNodeClick={onNodeClick}
          onPaneClick={onPaneClick}
          onNodeDoubleClick={onNodeDoubleClick}
          fitView
        >
          <MiniMap />
          <Controls />
          <Background />
        </ReactFlow>
      </div>

      {selectedNode && (
        <div className="detail-panel">
          <div className="detail-header">
            <div className="detail-title">Node Details</div>
            <button className="detail-close" onClick={() => setSelectedNodeId(null)}>×</button>
          </div>

          <div className="detail-field">
            <div className="detail-label">ID</div>
            <div className="detail-value">{selectedNode.id}</div>
          </div>

          <div className="detail-field">
            <div className="detail-label">Label</div>
            <input id="detail-label" defaultValue={selectedNode.label || ""} style={{width: "100%"}} />
          </div>

          <div className="detail-field">
            <div className="detail-label">Status</div>
            <select id="detail-status" defaultValue={selectedNode.status || "todo"} style={{width: "100%"}}>
              <option value="todo">todo</option>
              <option value="doing">doing</option>
              <option value="done">done</option>
              <option value="blocked">blocked</option>
            </select>
          </div>

          <div className="detail-field">
            <div className="detail-label">Notes</div>
            <textarea id="detail-notes" defaultValue={selectedNode.notes || ""} rows={4} style={{width: "100%"}} />
          </div>

          <div className="detail-field">
            <div className="detail-label">Priority</div>
            <select id="detail-priority" defaultValue={selectedNode.priority || ""} style={{width: "100%"}}>
              <option value="">-</option>
              <option value="low">low</option>
              <option value="medium">medium</option>
              <option value="high">high</option>
              <option value="urgent">urgent</option>
            </select>
          </div>

          <div className="detail-field">
            <div className="detail-label">Type</div>
            <select id="detail-type" defaultValue={selectedNode.type || ""} style={{width: "100%"}}>
              <option value="">-</option>
              <option value="idea">idea</option>
              <option value="task">task</option>
              <option value="decision">decision</option>
              <option value="fact">fact</option>
              <option value="issue">issue</option>
              <option value="resource">resource</option>
            </select>
          </div>

          <div className="detail-field">
            <div className="detail-label">Owner</div>
            <input id="detail-owner" defaultValue={selectedNode.owner || ""} style={{width: "100%"}} />
          </div>

          <div className="detail-field">
            <div className="detail-label">Source</div>
            <input id="detail-source" defaultValue={selectedNode.source || ""} style={{width: "100%"}} />
          </div>

          <div className="detail-field">
            <div className="detail-label">Attachments (JSON array)</div>
            <textarea id="detail-attachments" defaultValue={JSON.stringify(selectedNode.attachments || [], null, 2)} rows={3} style={{width: "100%", fontFamily: "monospace", fontSize: 12}} />
          </div>

          <div className="detail-actions">
            <button onClick={saveDetail}>Save</button>
            <button className="secondary" onClick={() => setSelectedNodeId(null)}>Close</button>
          </div>
        </div>
      )}

      {quickEditNode && (
        <div className="quick-edit-overlay" onClick={() => setQuickEditNode(null)}>
          <div className="quick-edit-dialog" onClick={e => e.stopPropagation()}>
            <div className="quick-edit-title">Quick Edit: {quickEditNode.id}</div>
            <div className="detail-field">
              <div className="detail-label">Label</div>
              <input
                value={quickEditLabel}
                onChange={e => setQuickEditLabel(e.target.value)}
                style={{width: "100%"}}
                autoFocus
              />
            </div>
            <div className="detail-field">
              <div className="detail-label">Notes</div>
              <textarea
                value={quickEditNotes}
                onChange={e => setQuickEditNotes(e.target.value)}
                rows={4}
                style={{width: "100%"}}
              />
            </div>
            <div className="quick-edit-actions">
              <button onClick={saveQuickEdit}>Save</button>
              <button className="secondary" onClick={() => setQuickEditNode(null)}>Cancel</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
